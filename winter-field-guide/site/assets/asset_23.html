<script src="d3.min.js"></script>
<script>
(()=>{
 const root=document.getElementById('tibet-d8');
 if(typeof d3==='undefined')return;
 const data=JSON.parse(document.getElementById('tibet-d8-data').textContent);
 const svg=d3.select(root.querySelector('.map-svg'));
 const picker=root.querySelector('.day-picker');
 const list=root.querySelector('.point-list');
 const detail=root.querySelector('.selected-detail');
 let chosen=data.defaultDay;
 const point=k=>data.points[k];
 if(data.overview){
  root.querySelector('.map-controls').hidden=false;
  for(const d of data.days){const opt=document.createElement('option');opt.value=d.id;opt.textContent=d.label;picker.appendChild(opt)}
  picker.value=chosen;picker.addEventListener('change',()=>{chosen=picker.value;render()});
 }
 function render(){
  const day=data.days.find(x=>x.id===chosen)||data.days[0];
  const options=day.optional||[];
  const all=[...new Set(day.route.concat(...options))].filter(k=>point(k));
  const width=Math.max(300,Math.round(root.clientWidth));
  const height=width<480?420:430;
  svg.attr('viewBox',`0 0 ${width} ${height}`).attr('height',height);svg.selectAll('*').remove();
  svg.append('title').text(day.label);
  svg.append('desc').text(day.route.map(k=>point(k).name).join('，然后到')+'。虚线为可选支线，点位用于地理理解。');
  const coords=all.map(k=>[point(k).lon,point(k).lat]);
  let xmin=d3.min(coords,d=>d[0]),xmax=d3.max(coords,d=>d[0]),ymin=d3.min(coords,d=>d[1]),ymax=d3.max(coords,d=>d[1]);
  const dx=Math.max(.012,xmax-xmin),dy=Math.max(.012,ymax-ymin);
  const pad=data.overview&&chosen==='all'?.09:.13;
  const rect=[[xmin-dx*pad,ymin-dy*pad],[xmax+dx*pad,ymax+dy*pad]];
  const bounds={type:'FeatureCollection',features:rect.map(c=>({type:'Feature',geometry:{type:'Point',coordinates:c}}))};
  const projection=d3.geoMercator().fitExtent([[32,30],[width-32,height-35]],bounds);
  const path=d3.geoPath(projection);
  svg.append('defs').append('clipPath').attr('id','tibet-d8-clip').append('rect').attr('width',width).attr('height',height);
  const g=svg.append('g').attr('clip-path','url(#tibet-d8-clip)');
  const local=dx<.15&&dy<.15;
  const draw=(geo,cls)=>g.selectAll('.'+cls).data((geo&&geo.features)||[]).join('path').attr('class',cls).attr('d',path);
  draw(data.geometry.roads,'road');draw(data.geometry.rivers,'river');draw(data.geometry.lakes,'lake');
  if(local){draw(data.geometry.streets,'street');draw(data.geometry.localwater,'river')}
  const line=keys=>({type:'LineString',coordinates:keys.map(k=>[point(k).lon,point(k).lat])});
  g.append('path').attr('class','route').attr('d',path(line(day.route)));
  for(const seq of options)g.append('path').attr('class','branch').attr('d',path(line(seq)));
  const occupied=[];const placed=[];
  const last=day.route[day.route.length-1];
  list.textContent='';
  function show(k){const p=point(k);detail.textContent=p.name+'：'+(p.note||'位置为区域参考，实际入口与允许停车处现场确认。')}
  for(const key of all){
   const p=point(key),c=projection([p.lon,p.lat]);const main=day.route.includes(key);
   const numbers=day.route.map((k,i)=>k===key?String(i+1):null).filter(Boolean).join('/');
   const label=(key===last?'★ ':'')+p.name;
   const node=g.append('g').attr('class',(main?'':'optional ')+'cursor-interaction').attr('transform',`translate(${c[0]},${c[1]})`).attr('data-tooltip',label).on('click',()=>show(key));
   node.append('circle').attr('r',17).attr('fill','transparent');
   node.append('circle').attr('class','point').attr('r',main?7:6);
   if(main&&width>=480)node.append('text').attr('text-anchor','middle').attr('dy',4).text(numbers.includes('/')?'↺':numbers);
   const txt=g.append('text').attr('class','place-label').text(label);
   const bbox=txt.node().getBBox();let success=false;
   for(const [ox,oy,anchor] of [[13,-11,'start'],[13,19,'start'],[-13,-11,'end'],[-13,19,'end'],[0,-26,'middle'],[0,33,'middle']]){
    const xx=c[0]+ox,yy=c[1]+oy;const left=anchor==='end'?xx-bbox.width:anchor==='middle'?xx-bbox.width/2:xx;const box=[left,yy-12,left+bbox.width,yy+3];
    if(box[0]<5||box[2]>width-5||box[1]<5||box[3]>height-5)continue;
    if(occupied.some(q=>!(box[2]+4<q[0]||box[0]-4>q[2]||box[3]+3<q[1]||box[1]-3>q[3])))continue;
    txt.attr('x',xx).attr('y',yy).attr('text-anchor',anchor);occupied.push(box);success=true;placed.push(key);break;
   }
   if(!success)txt.remove();
   const btn=document.createElement('button');btn.type='button';btn.className='btn btn-ghost';btn.textContent=(main?numbers+' ':'支线 ')+label;btn.addEventListener('click',()=>show(key));list.appendChild(btn);
  }
  detail.textContent=day.note;
  const p0=projection.invert([width-115,height-20]);const p1=projection.invert([width-35,height-20]);const km=d3.geoDistance(p0,p1)*6371;
  const scale=svg.append('g');scale.append('path').attr('d',`M${width-115},${height-20}h80`).attr('stroke','var(--foreground)').attr('fill','none');scale.append('text').attr('x',width-75).attr('y',height-28).attr('text-anchor','middle').text('约 '+(km<2?km.toFixed(1):Math.round(km))+' km');
 }
 let lastWidth=0;new ResizeObserver(()=>{const w=Math.round(root.clientWidth);if(w!==lastWidth){lastWidth=w;render()}}).observe(root);render();
})();
</script>
